name: GPU Contract Mirror

# Fails when synanton.gpu.v1 diverges between this repository and synanton/platform.

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'java/gpu-contract/src/main/proto/**'
      - 'scripts/verify-gpu-contract-mirror.sh'
      - '.github/workflows/gpu-contract-mirror.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'java/gpu-contract/src/main/proto/**'
      - 'scripts/verify-gpu-contract-mirror.sh'
      - '.github/workflows/gpu-contract-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mirror:
    name: Verify GPU contract matches platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gpu-runtime
        uses: actions/checkout@v4
        with:
          path: gpu-runtime

      - name: Checkout platform
        uses: actions/checkout@v4
        with:
          repository: Synanton/platform
          path: platform
          fetch-depth: 1

      - name: Verify contract mirror
        working-directory: gpu-runtime
        run: |
          chmod +x scripts/verify-gpu-contract-mirror.sh
          ./scripts/verify-gpu-contract-mirror.sh "${GITHUB_WORKSPACE}/platform"

      - name: Confirm the check is enforcing, not skipping
        working-directory: gpu-runtime
        run: |
          if ! ./scripts/verify-gpu-contract-mirror.sh "${GITHUB_WORKSPACE}/platform" | grep -q '^OK:'; then
            echo "Mirror check did not report OK — it likely skipped. Treating as failure."
            exit 1
          fi
