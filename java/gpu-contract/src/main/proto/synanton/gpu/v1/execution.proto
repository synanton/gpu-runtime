syntax = "proto3";

package synanton.gpu.v1;

import "synanton/gpu/v1/common.proto";
import "synanton/gpu/v1/error.proto";

option java_package = "com.synanton.gpu.v1";
option java_outer_classname = "ExecutionProto";
option java_multiple_files = true;

// GpuExecutionService is the gRPC boundary between SynAnton Core and the GPU Execution Plane.
//
// Ownership boundaries:
//   SynAnton Core owns: request_id, tenant_id, model selection, execution planning, CPU fallback.
//   GPU Gateway owns:   execution_id, admission, dispatch, idempotency, telemetry.
//   Kubernetes owns:    pod placement, node selection, GPU allocation.
//
// Stream close semantics:
//   If the caller's stream closes before Execute returns, the Gateway does NOT cancel the
//   underlying GPU operation. Callers MUST call GetStatus(execution_id) to reconcile.
service GpuExecutionService {
    // Execute dispatches a GPU workload and blocks until completion or deadline.
    rpc Execute(ExecutionRequest) returns (ExecutionResponse);

    // Cancel is best-effort. Does not imply rollback of primary-platform business state.
    rpc Cancel(CancelRequest) returns (CancelResponse);

    // GetStatus is authoritative. Always safe to call after an Execute timeout or disconnect.
    rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// ExecutionState is the lifecycle of a single GPU execution attempt.
// Transitions: ACCEPTED → QUEUED → MODEL_LOADING → RUNNING → SUCCEEDED
//              At any non-terminal state: → FAILED | CANCELLED
enum ExecutionState {
    EXECUTION_STATE_UNSPECIFIED = 0;
    ACCEPTED      = 1;  // Request admitted; waiting to be queued
    QUEUED        = 2;  // In admission queue; awaiting GPU capacity
    MODEL_LOADING = 3;  // GPU runtime loading the model
    RUNNING       = 4;  // Dispatched and executing on GPU runtime
    SUCCEEDED     = 5;  // Terminal — completed successfully
    FAILED        = 6;  // Terminal — failed
    CANCELLED     = 7;  // Terminal — cancelled (best-effort; no business rollback implied)
}

// CancellationOutcome describes whether Cancel() was applied.
enum CancellationOutcome {
    CANCELLATION_OUTCOME_UNSPECIFIED = 0;
    CANCEL_ACCEPTED    = 1;  // Cancellation accepted; execution is being stopped
    ALREADY_COMPLETED  = 2;  // Execution completed before cancellation arrived
    NOT_APPLICABLE     = 3;  // Execution not found or already in terminal state
}

// ExecutionResponse is returned by the GPU Gateway after Execute completes.
// execution_id is generated by the Gateway; callers MUST NOT set it.
message ExecutionResponse {
    string         request_id   = 1;
    string         execution_id = 2;
    ExecutionState state        = 3;

    // result is the operation-specific output, JSON-encoded.
    // Populated only when state == SUCCEEDED.
    bytes       result = 4;
    ErrorDetail error  = 5;
    UsageReport usage  = 6;
}

message CancelRequest {
    string execution_id = 1;
    string request_id   = 2;
}

message CancelResponse {
    string              execution_id = 1;
    CancellationOutcome outcome      = 2;
}

message StatusRequest {
    string execution_id = 1;
}

// StatusResponse is the authoritative post-execution state record.
// Readable via GetStatus() even after the initiating Execute() stream has closed.
message StatusResponse {
    string         request_id   = 1;
    string         execution_id = 2;
    ExecutionState state        = 3;
    ErrorDetail    error        = 4;
    UsageReport    usage        = 5;
}
