# GPU-7 acceptance profile (ExternalAcceptanceTest). ${fake.base} is the in-test fake
# provider server; each provider is a path prefix with its own runtime/circuit breaker.
gpu-gateway:
  dispatch:
    strategy: external
    vllm-endpoint: ${fake.base}/local      # must receive ZERO calls (no local fallback)
    timeout-ms: 1500                       # the 'slow' provider sleeps longer than this
  routing:
    external-enabled: true
  providers:
    mock:    { base-url: "${fake.base}/good/v1",    api-key: good-key }
    flaky:   { base-url: "${fake.base}/flaky/v1",   api-key: k, circuit-breaker: { failure-threshold: 100 } }
    slow:    { base-url: "${fake.base}/slow/v1",    api-key: k, circuit-breaker: { failure-threshold: 100 } }
    fragile: { base-url: "${fake.base}/fragile/v1", api-key: k, circuit-breaker: { failure-threshold: 2, reset-seconds: 300 } }
    dead:    { base-url: "http://127.0.0.1:1/v1",   api-key: k, circuit-breaker: { failure-threshold: 100 } }
    busy:    { base-url: "${fake.base}/busy/v1",    api-key: k, circuit-breaker: { failure-threshold: 100 } }
    offline: { base-url: "${fake.base}/good/v1",    api-key: k, enabled: false }
  model-catalog:
    operations:
      SYNTHESIZE:
        default-model: gpt-4o-shared
        models:
          gpt-4o-shared:  { provider: MOCK,    provider-model-id: openai/gpt-4o, input-usd-per-million: 1, output-usd-per-million: 2 }
          sensitive-chat: { provider: MOCK,    provider-model-id: openai/gpt-4o, tags: [sensitive], input-usd-per-million: 1, output-usd-per-million: 2 }
          flaky-chat:     { provider: FLAKY,   provider-model-id: up-flaky,   input-usd-per-million: 1, output-usd-per-million: 2 }
          slow-chat:      { provider: SLOW,    provider-model-id: up-slow,    input-usd-per-million: 1, output-usd-per-million: 2 }
          fragile-chat:   { provider: FRAGILE, provider-model-id: up-fragile, input-usd-per-million: 1, output-usd-per-million: 2 }
          dead-chat:      { provider: DEAD,    provider-model-id: up-dead,    input-usd-per-million: 1, output-usd-per-million: 2 }
          off-chat:       { provider: OFFLINE, provider-model-id: up-off,     input-usd-per-million: 1, output-usd-per-million: 2 }
          shared-local:   { provider: LOCAL,   provider-model-id: shared-local }
          # T-K8S-52 failover cases
          failover-chat:      { provider: BUSY,  provider-model-id: up-busy, input-usd-per-million: 1, output-usd-per-million: 2,
                                fallbacks: [ { provider: MOCK, provider-model-id: openai/gpt-4o, input-usd-per-million: 3, output-usd-per-million: 4 } ] }
          dead-failover-chat: { provider: DEAD,  provider-model-id: up-dead, input-usd-per-million: 1, output-usd-per-million: 2,
                                fallbacks: [ { provider: MOCK, provider-model-id: openai/gpt-4o } ] }
          accepted-500-chat:  { provider: FLAKY, provider-model-id: up-flaky, input-usd-per-million: 1, output-usd-per-million: 2,
                                fallbacks: [ { provider: MOCK, provider-model-id: openai/gpt-4o } ] }
          all-down-chat:      { provider: BUSY,  provider-model-id: up-busy, input-usd-per-million: 1, output-usd-per-million: 2,
                                fallbacks: [ { provider: DEAD, provider-model-id: up-dead } ] }
          offline-primary-chat: { provider: OFFLINE, provider-model-id: up-off, input-usd-per-million: 1, output-usd-per-million: 2,
                                fallbacks: [ { provider: MOCK, provider-model-id: openai/gpt-4o } ] }
      EMBED:
        default-model: shared-embed
        models:
          shared-embed:   { provider: MOCK, provider-model-id: prov-embed, input-usd-per-million: 1, output-usd-per-million: 0 }
      RERANK:
        default-model: shared-rerank
        models:
          shared-rerank:  { provider: MOCK, provider-model-id: prov-rerank, input-usd-per-million: 1, output-usd-per-million: 0 }
      RESPOND:
        default-model: shared-responses
        models:
          shared-responses: { provider: MOCK, provider-model-id: openai/gpt-4o, input-usd-per-million: 1, output-usd-per-million: 2 }
  sensitivity:
    block-external-tags: [sensitive, pii]
  budget:
    enforcement: enabled
    default-daily-usd: 5.00
    tenant-daily-usd:
      poor-tenant: 0.000001
  usage:
    cost-ledger: enabled

spring:
  flyway:
    enabled: true
