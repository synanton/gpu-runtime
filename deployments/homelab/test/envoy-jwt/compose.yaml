# T-K8S-6a local end-to-end test (no GPUs). Run it with scripts/envoy-jwt-local-test.sh, which
# prepares WORK_DIR (dev PKI, execution-JWT keys, and configs extracted verbatim from the GPU-5
# blueprints) and runs the checks.
#
# Service names match the cluster's (gpu-gateway, envoy, tei-embedding, vllm-synthesis,
# vllm-reranker), so the blueprint Envoy and Gateway configs run unmodified.
name: gpu5-envoy-jwt-test

x-backend: &backend
  build:
    context: .
    dockerfile_inline: |
      FROM python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
      COPY mock_backend.py /app/mock_backend.py
      CMD ["python3", "/app/mock_backend.py"]
  image: gpu5-envoy-jwt-test-backend:local

services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gpu
      POSTGRES_PASSWORD: e2e-only
      POSTGRES_DB: gpu_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu -d gpu_plane"]
      interval: 3s
      retries: 20

  tei-embedding:
    <<: *backend
    environment: { BACKEND_NAME: tei-embedding }
  vllm-synthesis:
    <<: *backend
    environment: { BACKEND_NAME: vllm-synthesis }
  vllm-reranker:
    <<: *backend
    environment: { BACKEND_NAME: vllm-reranker }

  gpu-gateway:
    image: ${GATEWAY_IMAGE:-gpu-gateway:t6a-local}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GPU_GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/gpu_plane
      GPU_GATEWAY_DB_USER: gpu
      GPU_GATEWAY_DB_PASSWORD: e2e-only
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/gpu-gateway/config/gateway-local.yaml
    volumes:
      - ${WORK_DIR:?}/gateway-config:/etc/gpu-gateway/config:ro   # blueprint ConfigMap, verbatim
      - ${WORK_DIR:?}/pki:/etc/gpu-gateway/tls:ro                  # gen-certs.sh dev PKI
      - ${WORK_DIR:?}/jwt-secret:/etc/gpu-gateway/keys:ro          # current.key + current.pub + previous.pub
    ports:
      - "127.0.0.1:29090:9090"   # gRPC (mTLS)
      - "127.0.0.1:28090:8090"   # JWKS (checked directly by the test)
      - "127.0.0.1:28091:8091"   # actuator (readiness)

  envoy:
    image: local-registry:5000/envoy:v1.31.0
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ${WORK_DIR:?}/envoy-config:/etc/envoy:ro                   # blueprint ConfigMap, verbatim
    ports:
      - "127.0.0.1:28080:8080"   # execution listener (forged/unsigned token checks)
