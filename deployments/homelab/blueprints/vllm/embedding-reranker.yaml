# Colocated embedding + reranker — node3 (D2/D4 of gpu-5-implementation-plan.md).
# One Pod, two vLLM containers, ONE nvidia.com/gpu: 1 request (declared by the
# embedding container only) — the reranker container gets the same GPU visibility
# via the Pod-level device-plugin grant (pattern proven by speech-stt-tts).
# Both containers must cap --gpu-memory-utilization; the values are fractions of
# TOTAL GPU memory and must sum well below 1.0 (0.20 + 0.20 here = ~6.6GB of 16GB).
#
# Ports: the two containers share the pod network namespace, so they MUST listen
# on different ports (embedding 8000, reranker 8001). Two Services select the same
# pod with different targetPorts so cluster addressing stays uniform (:8000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-embed-rerank
  namespace: gpu-plane
  labels:
    app: vllm-embed-rerank
spec:
  replicas: 1
  strategy:
    type: Recreate # single node GPU - a surge pod could never schedule anyway
  selector:
    matchLabels:
      app: vllm-embed-rerank
  template:
    metadata:
      labels:
        app: vllm-embed-rerank
    spec:
      runtimeClassName: nvidia
      nodeName: node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: embedding
          image: local-registry:5000/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /models
            - --runner
            - pooling
            - --served-model-name
            - synanton-qwen3-embedding-0.6b
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.20"
            - --max-model-len
            - "8192"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1 # the only GPU request in this pod — deliberate
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: model-embedding
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
        - name: reranker
          image: local-registry:5000/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /models
            - --runner
            - pooling
            - --served-model-name
            - synanton-qwen3-reranker-0.6b
            - --host
            - "0.0.0.0"
            - --port
            - "8001" # not 8000 — shared pod network namespace
            - --gpu-memory-utilization
            - "0.20"
            - --max-model-len
            - "8192"
            - --hf-overrides
            # official Qwen3-Reranker checkpoint is Qwen3ForCausalLM; this routes
            # it to sequence-classification with yes/no logit scoring (vLLM PR #19260)
            - '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8001
          resources:
            requests: # no nvidia.com/gpu here — inherits pod-level GPU visibility
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: model-reranker
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-embedding
          hostPath:
            path: /mnt/local-fast/models/qwen3-embedding-0.6b
            type: Directory
        - name: model-reranker
          hostPath:
            path: /mnt/local-fast/models/qwen3-reranker-0.6b # already present on node3 (plan D3)
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-embedding
  namespace: gpu-plane
spec:
  selector:
    app: vllm-embed-rerank
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-reranker
  namespace: gpu-plane
spec:
  selector:
    app: vllm-embed-rerank
  ports:
    - protocol: TCP
      port: 8000 # uniform cluster addressing; reranker container listens on 8001
      targetPort: 8001
  type: ClusterIP
