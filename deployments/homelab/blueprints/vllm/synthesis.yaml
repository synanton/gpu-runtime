# vLLM synthesis workload — node3, Qwen3-4B-Instruct-2507.
# One workload per physical GPU (PR #15 review P0.1, plan D2): the newest GPU
# (RTX 5060 Ti) serves the highest memory-pressure workload (KV cache, long
# context, concurrency). Model weights via hostPath
# /mnt/local-fast/models/qwen3-4b-instruct-2507 -> /models (read-only).
# Pinned to node3 because model storage is node-local (Local Models Setup §8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-synthesis
  namespace: gpu-plane
  labels:
    app: vllm-synthesis
spec:
  replicas: 1
  strategy:
    type: Recreate # single node GPU - a surge pod could never schedule anyway
  selector:
    matchLabels:
      app: vllm-synthesis
  template:
    metadata:
      labels:
        app: vllm-synthesis
    spec:
      runtimeClassName: nvidia
      nodeName: node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: vllm
          image: local-registry:5000/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            # the vllm-openai image ENTRYPOINT is already [\"vllm\", \"serve\"]: the model path comes first
            - /models
            - --served-model-name
            - synanton-qwen3-4b-synthesis
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "8"
          env:
            # weights are local; never phone home to HF at startup
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            # torch.compile / CUDA-graph cache: an emptyDir survives container restarts in the
            # pod, so a restart doesn't pay the multi-minute cold compile again
            - name: vllm-cache
              mountPath: /root/.cache/vllm
          # Cold start (weights + torch.compile + CUDA graphs) measured at ~4.5 min on the
          # RTX 5060 Ti. The old liveness window (180 s + 3×30 s) killed it just before it
          # served. The startup probe allows up to 15 min; liveness/readiness start after it.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: vllm-cache
          emptyDir: {}
        - name: model
          hostPath:
            path: /mnt/local-fast/models/qwen3-4b-instruct-2507
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-synthesis
  namespace: gpu-plane
spec:
  selector:
    app: vllm-synthesis
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
