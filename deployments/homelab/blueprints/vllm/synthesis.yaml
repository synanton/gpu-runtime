# vLLM synthesis workload — node2, Qwen3-4B-Instruct-2507.
# Model weights via hostPath /mnt/local-fast/models/qwen3-4b-instruct-2507 -> /models (read-only).
# Pinned to node2 because model storage is node-local (Local Models Setup §8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-synthesis
  namespace: gpu-plane
  labels:
    app: vllm-synthesis
spec:
  replicas: 1
  strategy:
    type: Recreate # single node GPU - a surge pod could never schedule anyway
  selector:
    matchLabels:
      app: vllm-synthesis
  template:
    metadata:
      labels:
        app: vllm-synthesis
    spec:
      runtimeClassName: nvidia
      nodeName: node2
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: vllm
          image: local-registry:5000/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /models
            - --served-model-name
            - synanton-qwen3-4b-synthesis
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "8"
          env:
            # weights are local; never phone home to HF at startup
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120 # first-boot kernel autotune can take minutes
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model
          hostPath:
            path: /mnt/local-fast/models/qwen3-4b-instruct-2507
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-synthesis
  namespace: gpu-plane
spec:
  selector:
    app: vllm-synthesis
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
