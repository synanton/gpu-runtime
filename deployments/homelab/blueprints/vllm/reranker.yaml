# vLLM reranker workload — node2, Qwen3-Reranker-0.6B (D2 of gpu-5-implementation-plan.md).
# One workload per physical GPU (PR #15 review P0.1): dedicated RTX 4060 Ti,
# uniform :8000 (the retracted colocation's port-8001 hack is gone).
# Model weights via hostPath /mnt/local-fast/models/qwen3-reranker-0.6b -> /models (read-only).
# Pinned to node2 because model storage is node-local (Local Models Setup §8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-reranker
  namespace: gpu-plane
  labels:
    app: vllm-reranker
spec:
  replicas: 1
  strategy:
    type: Recreate # single node GPU - a surge pod could never schedule anyway
  selector:
    matchLabels:
      app: vllm-reranker
  template:
    metadata:
      labels:
        app: vllm-reranker
    spec:
      runtimeClassName: nvidia
      nodeName: node2
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: vllm
          image: local-registry:5000/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            # the vllm-openai image ENTRYPOINT is already [\"vllm\", \"serve\"]: the model path comes first
            - /models
            - --runner
            - pooling
            - --served-model-name
            - synanton-qwen3-reranker-0.6b
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.40" # envelope, not a guarantee (plan §6, review P1.5)
            - --max-model-len
            - "8192"
            - --hf-overrides
            # official Qwen3-Reranker checkpoint is Qwen3ForCausalLM; this routes
            # it to sequence-classification with yes/no logit scoring (vLLM PR #19260)
            - '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
          env:
            # weights are local; never phone home to HF at startup
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            # torch.compile / CUDA-graph cache: an emptyDir survives container restarts in the
            # pod, so a restart doesn't pay the multi-minute cold compile again
            - name: vllm-cache
              mountPath: /root/.cache/vllm
          # Cold start (weights + torch.compile + CUDA graphs) measured at ~4.5 min on the
          # RTX 5060 Ti. The old liveness window (180 s + 3×30 s) killed it just before it
          # served. The startup probe allows up to 15 min; liveness/readiness start after it.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: vllm-cache
          emptyDir: {}
        - name: model
          hostPath:
            path: /mnt/local-fast/models/qwen3-reranker-0.6b
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-reranker
  namespace: gpu-plane
spec:
  selector:
    app: vllm-reranker
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
