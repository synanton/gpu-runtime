# Gateway — sole entry point (Plan v3.0.0 §2.1/§4): gRPC synanton.gpu.v1 on :9090,
# actuator :8091. Mirrors blueprints/gateway/gateway.yaml. Secrets are referenced by
# name and created imperatively (plan §7); they are never rendered by this chart.
{{- $m := .Values.models }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-gateway-config
data:
  gateway-local.yaml: |
    gpu-gateway:
      security:
        mode: mtls
        tls:
          cert-chain: /etc/gpu-gateway/tls/server.crt
          private-key: /etc/gpu-gateway/tls/server.key
          client-ca: /etc/gpu-gateway/tls/ca.crt
        principals:
          {{ .Values.gateway.platformPrincipal }}:
            tenants: ["*"]
            roles: [admin]
      dispatch:
        strategy: {{ .Values.gateway.strategy }}
        vllm-endpoint: {{ .Values.gateway.vllmEndpoint }}
        model-readiness: static   # Envoy-fronted always-on backends (GPU-5 plan §13.3 J3)
        health-path: /healthz
      execution-jwt:              # T-K8S-6a (Plan §12/§12.1)
        enabled: true
        key-dir: /etc/gpu-gateway/keys
        jwks-port: {{ .Values.gateway.jwksPort }}
      model-catalog:
        operations:
          SYNTHESIZE:
            default-model: {{ $m.synthesis.servedName }}
            models:
              "[{{ $m.synthesis.servedName }}]":
                provider: LOCAL
                display-name: "Qwen3-4B-Instruct-2507 (node3, vLLM)"
                is-default: true
                max-input-tokens: {{ $m.synthesis.maxModelLen }}
                max-output-tokens: 8192
          EMBED:
            default-model: {{ $m.embedding.servedName }}
            models:
              "[{{ $m.embedding.servedName }}]":
                provider: LOCAL
                display-name: "BAAI/bge-base-en-v1.5 (node1, TEI)"
                is-default: true
                max-input-tokens: 512
                embedding-dim: 768
          RERANK:
            default-model: {{ $m.reranker.servedName }}
            models:
              # bracket notation: model IDs may contain dots (Spring map binding)
              "[{{ $m.reranker.servedName }}]":
                provider: LOCAL
                display-name: "Qwen3-Reranker-0.6B (node2, vLLM)"
                is-default: true
                max-input-tokens: {{ $m.reranker.maxModelLen }}
      models:
        "[{{ $m.synthesis.servedName }}]":  { concurrency-limit: {{ .Values.gateway.concurrency.synthesis }}, max-input-tokens: {{ $m.synthesis.maxModelLen }}, runtime-class: vllm }
        "[{{ $m.embedding.servedName }}]":  { concurrency-limit: {{ .Values.gateway.concurrency.embedding }}, max-input-tokens: 512, runtime-class: tei }
        "[{{ $m.reranker.servedName }}]": { concurrency-limit: {{ .Values.gateway.concurrency.reranker }}, max-input-tokens: {{ $m.reranker.maxModelLen }}, runtime-class: vllm }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-gateway
  labels: { app: gpu-gateway }
spec:
  replicas: 1
  strategy: { type: RollingUpdate }
  selector:
    matchLabels: { app: gpu-gateway }
  template:
    metadata:
      labels: { app: gpu-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: /actuator/prometheus
    spec:
      nodeName: {{ .Values.placement.gatewayNode }}
      {{- include "gpu-plane.pullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "gpu-plane.image" (list . .Values.images.gateway) }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: GPU_GATEWAY_DB_URL, value: {{ .Values.gateway.jdbcUrl | quote }} }
            - name: GPU_GATEWAY_DB_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.postgresCred }}, key: POSTGRES_USER }
            - name: GPU_GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.postgresCred }}, key: POSTGRES_PASSWORD }
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/etc/gpu-gateway/config/gateway-local.yaml" }
          ports:
            - { containerPort: 9090, name: grpc }
            - { containerPort: 8091, name: metrics }
            - { containerPort: {{ .Values.gateway.jwksPort }}, name: jwks } # JWKS for Envoy only
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/gpu-gateway/config, readOnly: true }
            - { name: tls, mountPath: /etc/gpu-gateway/tls, readOnly: true }
            - { name: jwt-keys, mountPath: /etc/gpu-gateway/keys, readOnly: true } # T-K8S-6a signing keys
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8091 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8091 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          configMap: { name: gpu-gateway-config }
        - name: tls
          secret: { secretName: {{ .Values.secrets.gatewayTls }}, defaultMode: 0400 }
        - name: jwt-keys
          secret:
            secretName: {{ .Values.secrets.gatewayJwtKeys }}
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-gateway
spec:
  selector: { app: gpu-gateway }
  ports:
    - { name: grpc, port: 9090, targetPort: 9090 }
    - { name: metrics, port: 8091, targetPort: 8091 }
    - { name: jwks, port: {{ .Values.gateway.jwksPort }}, targetPort: {{ .Values.gateway.jwksPort }} }
  type: ClusterIP
