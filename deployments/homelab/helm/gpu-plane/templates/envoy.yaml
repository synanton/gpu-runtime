# Envoy execution perimeter (spec §6, §12; T-K8S-6/6b). See
# blueprints/envoy/envoy-config.yaml header for the body-hash limitation note.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: execution
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: gpu-plane
                          domains: ["*"]
                          routes:
                            - match: { path: /healthz }   # signed liveness for GetStatus (T-K8S-6a)
                              direct_response: { status: 200, body: { inline_string: "ok" } }
                            - match: { prefix: /v1/chat/completions }
                              route: { cluster: vllm_synthesis, timeout: {{ .Values.envoy.upstreamTimeoutSeconds }}s }
                            - match: { prefix: /v1/embeddings }
                              route: { cluster: tei_embedding, timeout: {{ .Values.envoy.upstreamTimeoutSeconds }}s }
                            - match: { prefix: /v1/rerank }
                              route: { cluster: vllm_reranker, timeout: {{ .Values.envoy.upstreamTimeoutSeconds }}s }
                            - match: { prefix: /v1/score }
                              route: { cluster: vllm_reranker, timeout: {{ .Values.envoy.upstreamTimeoutSeconds }}s }
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            gpu-gateway:
                              issuer: {{ .Values.envoy.jwtIssuer }}
                              audiences:
                                - {{ .Values.envoy.jwtAudience }}
                              remote_jwks:
                                http_uri:
                                  uri: {{ .Values.envoy.jwksUri }}
                                  cluster: gpu_gateway
                                  timeout: 5s
                                cache_duration:
                                  seconds: {{ .Values.envoy.jwksCacheSeconds }}
                                async_fetch:     # fetch JWKS at startup (T-K8S-6a)
                                  failed_refetch_duration: 5s
                                retry_policy:
                                  num_retries: 3
                                  retry_back_off: { base_interval: 1s, max_interval: 5s }
                              forward: false   # the execution JWT never reaches the backends
                          rules:
                            - match: { prefix: / }
                              requires:
                                provider_name: gpu-gateway
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # Probe listener: kubelet can't reach the admin interface (127.0.0.1:9901, kept
        # private: it exposes /quitquitquit, /config_dump, …). Only GET /ready is proxied.
        - name: health
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9902
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: health
                    route_config:
                      name: health
                      virtual_hosts:
                        - name: health
                          domains: ["*"]
                          routes:
                            - match: { path: /ready }
                              route: { cluster: envoy_admin }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: envoy_admin
          type: STATIC
          load_assignment:
            cluster_name: envoy_admin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9901
        - name: gpu_gateway
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: gpu_gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: gpu-gateway, port_value: 8090 }
        - name: vllm_synthesis
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: vllm_synthesis
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: vllm-synthesis, port_value: 8000 }
        - name: tei_embedding
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: tei_embedding
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: tei-embedding, port_value: 8000 }
        - name: vllm_reranker
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: vllm_reranker
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: vllm-reranker, port_value: 8000 }
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels: { app: envoy }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      nodeName: {{ .Values.placement.envoyNode }}
      {{- include "gpu-plane.pullSecrets" . | nindent 6 }}
      containers:
        - name: envoy
          image: {{ include "gpu-plane.image" (list . .Values.images.envoy) }}
          imagePullPolicy: IfNotPresent
          args: [-c, /etc/envoy/envoy.yaml, --log-level, info]
          ports:
            - { containerPort: 8080 }
            - { containerPort: 9902 } # probe listener (/ready only)
          resources:
            requests: { cpu: "0.5", memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
          readinessProbe:
            httpGet: { path: /ready, port: 9902 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12 # waits for JWKS fetch (Gateway readiness precedes Envoy, §12)
          livenessProbe:
            httpGet: { path: /ready, port: 9902 }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: envoy-config }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
spec:
  selector: { app: envoy }
  ports:
    - { protocol: TCP, port: 8080, targetPort: 8080 }
  type: ClusterIP
