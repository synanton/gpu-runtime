# NetworkPolicy (spec §19, T-K8S-11) — default-deny base, then exactly the §19 flows.
# Direct client access to Envoy/vLLM/PostgreSQL is denied by the base policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels: { app: gpu-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }] # public API (clients / Traefik)
    - from:
        - podSelector:
            matchLabels: { app: envoy }
      ports: [{ protocol: TCP, port: 8090 }] # JWKS from Envoy only
    - ports: [{ protocol: TCP, port: 8091 }] # metrics scrape
  egress:
    - to:
        - podSelector:
            matchLabels: { app: envoy }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy
spec:
  podSelector:
    matchLabels: { app: envoy }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gpu-gateway }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: gpu-gateway }
      ports: [{ protocol: TCP, port: 8090 }]
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [vllm-synthesis, vllm-embed-rerank] }
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [vllm-synthesis, vllm-embed-rerank] }
  policyTypes: [Ingress]
  ingress:
    # §6: vLLM accepts traffic from Envoy only
    - from:
        - podSelector:
            matchLabels: { app: envoy }
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gpu-gateway }
      ports: [{ protocol: TCP, port: 5432 }]
