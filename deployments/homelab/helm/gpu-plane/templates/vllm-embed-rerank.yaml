# Colocated embedding + reranker — one pod, two containers, ONE GPU request
# (see blueprints/vllm/embedding-reranker.yaml header for the full rationale).
# Reranker listens on 8001: both containers share the pod network namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-embed-rerank
  labels: { app: vllm-embed-rerank }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: vllm-embed-rerank }
  template:
    metadata:
      labels: { app: vllm-embed-rerank }
    spec:
      runtimeClassName: {{ .Values.runtimeClass }}
      nodeName: {{ .Values.placement.embedRerankNode }}
      {{- include "gpu-plane.pullSecrets" . | nindent 6 }}
      containers:
        - name: embedding
          image: {{ include "gpu-plane.image" (list . .Values.images.vllm) }}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /models
            - --runner
            - pooling
            - --served-model-name
            - {{ .Values.models.embedding.servedName }}
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - {{ .Values.models.embedding.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ .Values.models.embedding.maxModelLen | quote }}
          env:
            {{- include "gpu-plane.hfOffline" . | nindent 12 }}
          ports:
            - { containerPort: 8000 }
          resources:
            requests: { nvidia.com/gpu: 1, cpu: "2", memory: 8Gi }
            limits: { nvidia.com/gpu: 1, cpu: "4", memory: 16Gi }
          volumeMounts:
            - { name: model-embedding, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
        - name: reranker
          image: {{ include "gpu-plane.image" (list . .Values.images.vllm) }}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /models
            - --runner
            - pooling
            - --served-model-name
            - {{ .Values.models.reranker.servedName }}
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --gpu-memory-utilization
            - {{ .Values.models.reranker.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ .Values.models.reranker.maxModelLen | quote }}
            - --hf-overrides
            - {{ .Values.models.reranker.hfOverrides | quote }}
          env:
            {{- include "gpu-plane.hfOffline" . | nindent 12 }}
          ports:
            - { containerPort: 8001 }
          resources:
            requests: { cpu: "2", memory: 8Gi }  # no nvidia.com/gpu — pod-level grant
            limits: { cpu: "4", memory: 16Gi }
          volumeMounts:
            - { name: model-reranker, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-embedding
          hostPath:
            path: {{ .Values.models.embedding.hostPath }}
            type: Directory
        - name: model-reranker
          hostPath:
            path: {{ .Values.models.reranker.hostPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-embedding
spec:
  selector: { app: vllm-embed-rerank }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-reranker
spec:
  selector: { app: vllm-embed-rerank }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8001 }
  type: ClusterIP
