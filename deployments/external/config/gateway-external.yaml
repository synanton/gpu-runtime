# GPU-7 deployment contract (spec §26/§33/§39-§44b). Mounted into the Gateway and
# merged over the bundled application.yml via SPRING_CONFIG_ADDITIONAL_LOCATION.
#
# Implementation state per key group (PR #15 review — do not claim more than exists):
#   dispatch.strategy            ENFORCED  — "external" selects provider routing;
#                                            unknown strategies fail startup (§5.5)
#   routing.external-enabled     ENFORCED  — kill switch denies all external routing
#   providers.<id>.api-key/base-url/enabled/circuit-breaker
#                              ENFORCED  — registry + generic OpenAI-compatible runtime
#   providers.<id>.health      DECLARED  — bound, but no health scheduler yet (T-K8S-46)
#   sensitivity / budget / usage.cost-ledger
#                              DECLARED  — ticket work (T-K8S-48/48b/49); not enforced
#
# The model-catalog drives provider selection (logical model → provider + provider
# model ID). The provider model ID is rewritten into the outbound payload and the
# logical ID restored on every downstream body, including every SSE chunk.

gpu-gateway:
  dispatch:
    strategy: external        # GPU-7 routing: provider adapters, never local vLLM.
                              # [T-K8S-44/§39] mode external-only; local-only/auto invalid.

  # [T-K8S-39/§32] kill switch: disabled => ALL external routing denied, fail closed.
  routing:
    external-enabled: true

  providers:
    openai:               # existing code schema (OpenAiRuntime)
      api-key: ${OPENAI_API_KEY:}    # §29: env-var reference, never inline, never logged
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}   # HTTPS only (§29)
      enabled: true           # [T-K8S-38] persisted control state, survives restart
      health:                 # [T-K8S-46] tracked independently of Gateway health
        path: /models
        interval-seconds: 60
      circuit-breaker:        # [T-K8S-45]
        failure-threshold: 5
        reset-seconds: 60
    mock:                     # T-K8S-51 acceptance provider (in-compose, plain HTTP
      api-key: ${MOCK_PROVIDER_API_KEY:}  #  inside the compose network only)
      base-url: http://mock-provider:8080/v1   # mock serves /v1/*; runtime appends /<operation path>
      enabled: true
      health:
        path: /healthz
        interval-seconds: 30
      circuit-breaker:
        failure-threshold: 5
        reset-seconds: 30

  model-catalog:
    operations:
      SYNTHESIZE:
        default-model: mock-chat-1
        models:
          mock-chat-1:
            provider: MOCK
            provider-model-id: mock-chat-1
            display-name: "Mock Chat (acceptance)"
            is-default: true
            max-input-tokens: 8192
            max-output-tokens: 2048
          gpt-4o-mini:        # real arm via OpenAi
            provider: OPENAI
            provider-model-id: openai/gpt-4o-mini
            display-name: "GPT-4o Mini"
            max-input-tokens: 128000
            max-output-tokens: 16384
      EMBED:
        default-model: mock-embedding-1
        models:
          mock-embedding-1:
            provider: MOCK
            provider-model-id: mock-embedding-1
            display-name: "Mock Embedding (acceptance)"
            is-default: true
            max-input-tokens: 8192
            embedding-dim: 1536
          text-embedding-3-small:   # platform benchmark's opt-in external arm
            provider: OPENAI    # (platform/docs/research/retrieval-evaluation-benchmark-plan.md §3.3)
            provider-model-id: openai/text-embedding-3-small
            display-name: "OpenAI text-embedding-3-small"
            max-input-tokens: 8192
            embedding-dim: 1536
      RERANK:
        default-model: mock-reranker-1
        models:
          mock-reranker-1:    # §40: advertised only because mock mapping supports it
            provider: MOCK
            provider-model-id: mock-reranker-1
            display-name: "Mock Reranker (acceptance)"
            is-default: true
            max-input-tokens: 4096

  # [T-K8S-49] sensitivity policy — DECLARED, not enforced yet (no model tags exist
  # in the catalog schema). Fail-closed enforcement lands with the ticket.
  sensitivity:
    block-external-tags: [sensitive, pii]

  # [T-K8S-48b] budget enforcement — DECLARED, not enforced yet (needs §33 PostgreSQL
  # state). Fail-closed enforcement lands with the ticket.
  budget:
    enforcement: enabled
    default-daily-usd: 5.00

  # [T-K8S-48] cost ledger — DECLARED; provider-reported usage IS captured on every
  # execution (ExecutionUsage), the ledger/reporting side lands with the ticket.
  usage:
    cost-ledger: enabled
